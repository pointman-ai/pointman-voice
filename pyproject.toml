[project]
name = "pointman-voice"
version = "0.2.0"
description = "Voice calls with your agents, run on your own machines."
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi",
    "huggingface_hub>=1.0",
    "numpy>=2.2",
    # Kokoro's English front end, and the spaCy model it would otherwise pip-install while running
    "misaki[en]==0.9.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # a Mac (Apple silicon): Kokoro and Parakeet on MLX
    "mlx-audio==0.6.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "parakeet-mlx==0.5.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Linux: Kokoro on PyTorch, Whisper turbo on CTranslate2
    "kokoro>=0.9.4; sys_platform == 'linux'",
    "faster-whisper>=1.1; sys_platform == 'linux'",
]

[tool.uv]
package = false          # the node runs it from its folder: `python -m pointman_voice`
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
